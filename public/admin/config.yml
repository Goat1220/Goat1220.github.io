# 블로그 글쓰기 페이지(/admin) 설정 — Sveltia CMS.
# 로그인: "Sign In with Token" → 이 저장소 Contents 읽기/쓰기 권한의 GitHub fine-grained 토큰.
backend:
  name: github
  repo: Goat1220/Goat1220.github.io
  branch: main
  commit_messages:
    create: "Add post: {{slug}}"
    update: "Update post: {{slug}}"
    delete: "Delete post: {{slug}}"
    uploadMedia: "Upload {{path}}"
    deleteMedia: "Delete {{path}}"

# 에디터에서 올린 이미지는 여기로 간다.
media_folder: /public/posts/uploads
public_folder: /posts/uploads

# 비워 둔 선택 항목(대표 이미지 등)은 frontmatter에 쓰지 않는다 — Astro 스키마 검증용.
output:
  omit_empty_optional_fields: true

collections:
  - name: posts
    label: 글
    label_singular: 글
    folder: /src/content/posts
    extension: md
    format: frontmatter
    create: true
    # 파일 이름 = 글 주소 (goat1220.github.io/posts/<주소>/)
    slug: "{{fields.urlname}}"
    summary: "{{date}} · {{title}}"
    sortable_fields: [date, title]
    fields:
      - { label: 제목, name: title, widget: string }
      - label: 글 주소(영문)
        name: urlname
        widget: string
        hint: "영문 소문자·숫자·하이픈만. 예) devlog-03. 처음 저장한 뒤에는 바꾸지 마세요."
        pattern: ["^[a-z0-9-]+$", "영문 소문자, 숫자, 하이픈(-)만 쓸 수 있어요"]
      - { label: 요약, name: description, widget: text, hint: "목록과 링크 미리보기에 나오는 한두 문장" }
      - { label: 날짜, name: date, widget: datetime, type: date, format: YYYY-MM-DD }
      - label: 카테고리
        name: category
        widget: select
        options:
          - { label: 일상, value: daily }
          - { label: 게임 개발, value: gamedev }
          - { label: 코딩 공부, value: study }
      - { label: 태그, name: tags, widget: list, required: false, default: [] }
      - { label: 대표 이미지, name: image, widget: image, required: false }
      - { label: 초안(공개 안 함), name: draft, widget: boolean, default: false, hint: "켜 두면 블로그에는 안 나오지만, 저장소가 공개라 GitHub에서는 보여요" }
      - { label: 본문, name: body, widget: richtext }
